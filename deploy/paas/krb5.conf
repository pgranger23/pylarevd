# CERN Kerberos realm, for XRootD's krb5 login to EOS (ticket cache from KRB5CCNAME).
[libdefaults]
 default_realm = CERN.CH
 ticket_lifetime = 25h
 renew_lifetime = 120h
 forwardable = true
 rdns = false
 dns_canonicalize_hostname = fallback

[realms]
 CERN.CH = {
  default_domain = cern.ch
  kdc = cerndc.cern.ch
 }

[domain_realm]
 .cern.ch = CERN.CH
