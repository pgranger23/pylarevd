<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pylarevd event viewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="toolbar">
  <div class="group">
    <label>file <select id="sel-file"></select></label>
    <button id="btn-prev" title="previous event (left arrow)">&#9664;</button>
    <label class="evlabel"><span id="ev-label">-</span></label>
    <button id="btn-next" title="next event (right arrow)">&#9654;</button>
    <label>go to <input id="inp-jump" type="number" min="0" step="1" title="event index in the file (0-based), Enter to jump"></label>
  </div>
  <div class="group" id="open-group">
    <label>open <input id="inp-open" type="text" spellcheck="false" placeholder="/path/to/file.root" title="absolute path of a .root file on the server, Enter to open"></label>
    <button id="btn-open" title="absolute path of a .root file on the server, Enter to open">open</button>
    <span id="open-msg" class="open-msg" hidden></span>
  </div>
  <div class="group">
    <label>hits <select id="sel-hits"></select></label>
    <label>flash <select id="sel-flash"></select></label>
  </div>
  <div class="group">
    <label>view
      <select id="sel-view">
        <option value="3d">3D</option>
        <option value="2d">2D</option>
        <option value="light">Light</option>
        <option value="charge+light">Charge+Light</option>
        <option value="2d+3d">2D+3D</option>
        <option value="optical">Optical (PDS)</option>
        <option value="flash3d">Flashes 3D (PDS)</option>
      </select>
    </label>
    <label>colour by
      <select id="sel-color">
        <option value="charge">charge</option>
        <option value="amplitude">amplitude</option>
        <option value="tick">tick</option>
        <option value="multiplicity">multiplicity</option>
        <option value="x">x</option><option value="y">y</option><option value="z">z</option>
        <option value="track">track</option>
        <option value="shower">shower</option>
        <option value="pfparticle">pfparticle</option>
        <option value="cluster">cluster</option>
        <option value="slice">slice</option>
        <option value="chisq">chisq (space points)</option>
        <option value="pdg">truth pdg</option>
      </select>
    </label>
    <label>scale
      <select id="sel-scale"><option value="auto">auto</option><option value="log">log</option><option value="linear">linear</option></select>
    </label>
    <label>cmap <select id="sel-cmap"></select></label>
    <label>theme
      <select id="sel-theme"><option value="dark">dark</option><option value="light">light</option></select>
    </label>
  </div>
  <div class="group overlays" id="overlays">
    <label><input type="checkbox" data-ov="truth"> truth</label><button id="btn-truth" class="small" aria-controls="truth-drawer" title="filter the true particles by species, origin or one by one">truth &#9662;</button>
    <label><input type="checkbox" data-ov="dep"> deposits</label>
    <label><input type="checkbox" data-ov="tracks"> tracks</label>
    <label><input type="checkbox" data-ov="showers"> showers</label>
    <label title="Pandora interaction vertex"><input type="checkbox" data-ov="pvtx"> interaction vtx</label>
    <label title="primary-daughter and secondary vertices"><input type="checkbox" data-ov="vtx"> vertices</label>
    <label><input type="checkbox" data-ov="labels"> labels</label>
    <label><input type="checkbox" data-ov="pd"> PD</label>
  </div>
  <div class="group overlays" id="trig-group" hidden>
    <label title="trigger primitives: one above-threshold pulse on one channel (2-D views)"><input type="checkbox" data-ov="tp"> TPs</label>
    <label title="trigger activities: boxes around the primitives each one groups (2-D views)"><input type="checkbox" data-ov="ta"> TAs</label>
    <label title="trigger candidates: their time window across every 2-D panel"><input type="checkbox" data-ov="tc"> TCs</label>
  </div>
  <div class="group" id="sel-group" hidden>
    <label title="what hovering / clicking a hit, space point or track selects; hold Shift to use the other one; none disables highlighting">select by
      <select id="sel-by"><option value="particle">particle</option><option value="slice">slice</option><option value="none">none</option></select>
    </label>
    <label title="brightness of everything outside the highlighted particle / slice (0 hides it, 100 leaves it unchanged)">others
      <input type="range" id="sel-dim" min="0" max="100" step="1" value="30" style="width:80px;vertical-align:middle"> <span id="sel-dim-v" class="muted">30%</span>
    </label>
    <label title="highlight the whole hierarchy of the particle: its top-level parent and all daughters (key f)"><input type="checkbox" id="cb-family"> family</label>
  </div>
  <div class="group">
    <button id="btn-reset" title="reset the 3D camera">reset view</button>
    <button id="btn-shot" title="save a PNG of the visible panels">screenshot</button>
    <button id="btn-link" title="copy a link to this exact state">link</button>
  </div>
</header>
<main id="main" data-view="3d">
  <section class="panel" id="panel-3d"></section>
  <section class="panel" id="panel-2d"></section>
  <section class="panel" id="panel-light"></section>
  <section class="panel" id="panel-optical"></section>
  <aside id="sel-card" hidden></aside>
  <aside id="truth-drawer" hidden>
    <div class="td-head"><b>True particles</b><button id="td-close" class="small" title="close (Esc)">&times;</button></div>
    <div class="td-tabs"><button data-tab="cat" class="on">Categories</button><button data-tab="part">Particles</button></div>
    <div class="td-body" id="td-cat"></div>
    <div class="td-body" id="td-part" hidden>
      <div class="td-tools">
        <input type="text" id="td-search" spellcheck="false" placeholder="search: mu-, proton, tid:123, pdg:2212" title="particle name, tid:&lt;track id&gt; or pdg:&lt;code&gt;. Enter pins the first match">
        <button id="td-reset" class="small" title="clear the individually hidden particles">reset</button>
      </div>
      <div class="td-info" id="td-info"></div>
      <div class="td-tree" id="td-tree"></div>
    </div>
    <div class="td-foot" id="td-foot"></div>
  </aside>
</main>
<section id="summary-bar" class="collapsed">
  <button id="sum-toggle" title="show/hide the full event summary">&#9656; <span id="sum-head">summary</span></button>
  <pre id="summary"></pre>
</section>
<footer id="status"><span id="status-text">starting...</span><span id="status-right"></span></footer>
<script type="module" src="main.js"></script>
</body>
</html>
